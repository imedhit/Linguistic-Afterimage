<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <filter id="cyanGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with stylized map tiles simulation -->
  <rect width="1920" height="1080" fill="url(#bgGrad4)"/>

  <!-- Simulated OpenStreetMap Streets and Urban Blocks -->
  <g opacity="0.35">
    <!-- Major thoroughfares -->
    <path d="M 0 540 H 1920" stroke="#475569" stroke-width="5"/>
    <path d="M 960 0 V 1080" stroke="#475569" stroke-width="5"/>
    <path d="M 300 100 L 1700 900" stroke="#334155" stroke-width="4"/>
    <path d="M 1600 100 L 200 950" stroke="#334155" stroke-width="4"/>
    <circle cx="960" cy="540" r="320" fill="none" stroke="#334155" stroke-width="3"/>

    <!-- Grid streets -->
    <path d="M 700 400 H 1200 M 700 460 H 1200 M 700 520 H 1200 M 700 580 H 1200 M 700 640 H 1200" stroke="#1e293b" stroke-width="2"/>
    <path d="M 750 380 V 660 M 850 380 V 660 M 950 380 V 660 M 1050 380 V 660 M 1150 380 V 660" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Real OpenStreetMap Bangalore Waterbodies -->
  <path d="M 1120 440 C 1170 420, 1220 460, 1200 500 C 1170 520, 1100 510, 1120 440 Z" fill="#0284c7" opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1135" y="480" fill="#7dd3fc" font-family="sans-serif" font-weight="600" font-size="11">Ulsoor Lake</text>

  <path d="M 840 280 C 880 270, 910 310, 890 350 C 860 360, 830 330, 840 280 Z" fill="#0284c7" opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="845" y="325" fill="#7dd3fc" font-family="sans-serif" font-weight="600" font-size="11">Sankey Tank</text>

  <!-- Top Navigation Header -->
  <rect width="1920" height="60" fill="#06080d" opacity="0.95"/>
  <line x1="0" y1="60" x2="1920" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="32" y="38" fill="#ffffff" font-family="Georgia, serif" font-size="20">Ec(ak)ou Ghost Speech Cartography</text>

  <!-- Top Sector Navigation & OSM Mode Switcher -->
  <g transform="translate(640, 14)">
    <rect width="640" height="34" rx="4" fill="#070a10" opacity="0.95" stroke="rgba(255,255,255,0.15)"/>
    <text x="16" y="22" fill="#94a3b8" font-family="monospace" font-size="11">SECTOR:</text>
    <rect x="70" y="5" width="40" height="24" fill="rgba(255,255,255,0.1)" rx="2"/>
    <text x="78" y="21" fill="#ffffff" font-family="monospace" font-size="11">ALL</text>
    <text x="125" y="21" fill="#94a3b8" font-family="monospace" font-size="11">CENTRAL</text>
    <text x="200" y="21" fill="#94a3b8" font-family="monospace" font-size="11">NORTH</text>
    <text x="260" y="21" fill="#94a3b8" font-family="monospace" font-size="11">SOUTH</text>
    <text x="320" y="21" fill="#94a3b8" font-family="monospace" font-size="11">EAST</text>
    <text x="375" y="21" fill="#94a3b8" font-family="monospace" font-size="11">WEST</text>
    <line x1="430" y1="5" x2="430" y2="29" stroke="rgba(255,255,255,0.2)"/>
    <rect x="445" y="5" width="180" height="24" rx="2" fill="rgba(0, 245, 212, 0.15)" stroke="rgba(0, 245, 212, 0.4)"/>
    <text x="465" y="21" fill="#00f5d4" font-family="monospace" font-weight="bold" font-size="11">OSM: STANDARD (CLEAR)</text>
  </g>

  <!-- Interactive Ghost Speech Layers Overlaid on OSM -->
  <!-- Human Language Zone: Chickpet Pete -->
  <polygon points="820,490 880,480 910,540 850,560 810,520" fill="rgba(0, 245, 212, 0.25)" stroke="#00f5d4" stroke-width="2" filter="url(#cyanGlow4)"/>
  <circle cx="855" cy="520" r="6" fill="#00f5d4"/>
  <text x="875" y="515" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Chickpet Pete</text>
  <text x="875" y="532" fill="#00f5d4" font-family="monospace" font-size="11">AI Incomprehension: 97.4%</text>

  <!-- Dead Zone: Manyata Tech Park Corridor -->
  <polygon points="980,240 1140,210 1190,320 1020,350" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-dasharray="6,4" stroke-width="2"/>
  <text x="1010" y="285" fill="#f43f5e" font-family="monospace" font-weight="bold" font-size="12">DEAD ZONE // MANYATA NLP SHIELD</text>

  <!-- Active Route Navigator Line from Chickpet to Russell Market -->
  <path d="M 855 520 Q 920 480 990 470 T 1080 430" fill="none" stroke="#00f5d4" stroke-width="5" filter="url(#cyanGlow4)"/>
  <path d="M 855 520 Q 920 480 990 470 T 1080 430" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Open Route Finder Panel -->
  <g transform="translate(48, 80)">
    <rect width="360" height="260" rx="4" fill="#070a10" opacity="0.96" stroke="rgba(255,255,255,0.15)"/>
    <rect width="360" height="38" fill="#090d16" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="24" fill="#00f5d4" font-family="monospace" font-size="11" letter-spacing="1">GHOST ROUTE NAVIGATOR // BANGALORE</text>
    
    <text x="16" y="65" fill="#94a3b8" font-family="monospace" font-size="10">ORIGIN SANCTUARY:</text>
    <rect x="16" y="74" width="328" height="32" rx="2" fill="#0c1220" stroke="rgba(255,255,255,0.1)"/>
    <text x="28" y="95" fill="#ffffff" font-family="monospace" font-size="12">Chickpet Pete Alleyways (Central)</text>

    <text x="16" y="130" fill="#94a3b8" font-family="monospace" font-size="10">DESTINATION SANCTUARY:</text>
    <rect x="16" y="140" width="328" height="32" rx="2" fill="#0c1220" stroke="rgba(255,255,255,0.1)"/>
    <text x="28" y="161" fill="#ffffff" font-family="monospace" font-size="12">Russell Market Meat Stalls (Central)</text>

    <rect x="16" y="190" width="328" height="48" rx="2" fill="rgba(0, 245, 212, 0.08)" stroke="rgba(0, 245, 212, 0.3)"/>
    <text x="28" y="210" fill="#00f5d4" font-family="monospace" font-size="11">STEALTH CLEARANCE: 94% · 3.2 KM</text>
    <text x="28" y="228" fill="#94a3b8" font-family="sans-serif" font-size="11">Avoids Cubbon surveillance radar corridors.</text>
  </g>

  <!-- Bottom Real OpenStreetMap HUD -->
  <rect x="32" y="1020" width="680" height="36" rx="3" fill="#070a10" opacity="0.95" stroke="rgba(255,255,255,0.1)"/>
  <text x="48" y="1043" fill="#00f5d4" font-family="monospace" font-size="11">OPENSTREETMAP BASE · 12.9716°N 77.5946°E · ZOOM 12 · HIGH VISIBILITY</text>
</svg>
