  <path d="M 1520 236 Q 1550 210 1580 236 T 1640 236 T 1700 220 T 1760 250 T 1820 230 T 1880 236" fill="none" stroke="#00f5d4" stroke-width="2" filter="url(#cyanGlow)"/>
  <text x="1524" y="214" fill="#94a3b8" font-family="monospace" font-size="9">LIVE OSCILLOSCOPE // 185 Hz</text>

