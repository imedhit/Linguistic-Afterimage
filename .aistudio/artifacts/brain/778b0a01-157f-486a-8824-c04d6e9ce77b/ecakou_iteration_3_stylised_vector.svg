<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="cyanGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="dotMatrix" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>
  <rect width="1920" height="1080" fill="url(#dotMatrix)"/>

  <!-- Top Header -->
  <rect width="1920" height="60" fill="#04060c" opacity="0.95"/>
  <line x1="0" y1="60" x2="1920" y2="60" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="32" y="38" fill="#ffffff" font-family="Georgia, serif" font-size="20">Ec(ak)ou: Autonomous Vector Cartography</text>
  <text x="1600" y="36" fill="#10b981" font-family="monospace" font-size="11">STANDALONE VECTOR // ZERO TILES</text>

  <!-- Outer Ring Road (ORR) Loop -->
  <path d="M 680 320 C 1140 220, 1420 380, 1380 680 C 1340 920, 920 960, 680 840 C 480 720, 440 420, 680 320 Z" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="12,6"/>
  <text x="1390" y="580" fill="#64748b" font-family="monospace" font-size="11" transform="rotate(75, 1390, 580)">OUTER RING ROAD (ORR)</text>

  <!-- NICE Peripheral Road Semi-Arc -->
  <path d="M 420 480 Q 360 840 820 1020" fill="none" stroke="#1e293b" stroke-width="4"/>
  <text x="410" y="740" fill="#475569" font-family="monospace" font-size="10" transform="rotate(-60, 410, 740)">NICE PERIPHERAL ROAD</text>

  <!-- Lakes & Green Parks -->
  <!-- Cubbon Park -->
  <path d="M 920 460 C 950 450, 970 480, 950 510 C 930 520, 910 490, 920 460 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="910" y="490" fill="#10b981" font-family="monospace" font-size="10">CUBBON PARK</text>

  <!-- Lalbagh Botanical Gardens -->
  <path d="M 890 560 C 940 550, 960 610, 920 640 C 870 630, 860 580, 890 560 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="890" y="605" fill="#10b981" font-family="monospace" font-size="10">LALBAGH GARDENS</text>

  <!-- Bellandur & Varthur Lakes -->
  <path d="M 1260 620 C 1320 600, 1360 640, 1310 680 C 1260 670, 1240 640, 1260 620 Z" fill="rgba(0, 245, 212, 0.1)" stroke="#00f5d4" stroke-width="1"/>
  <text x="1270" y="650" fill="#00f5d4" font-family="monospace" font-size="9">BELLANDUR LAKE</text>

  <!-- Real Neighborhood Labels Placed in Bengaluru Topology -->
  <text x="820" y="470" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="13">Chickpet</text>
  <text x="800" y="440" fill="#94a3b8" font-family="sans-serif" font-size="12">Majestic (KSR)</text>
  <text x="760" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">Malleswaram</text>
  <text x="980" y="440" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="13">Cantonment</text>
  <text x="1060" y="450" fill="#94a3b8" font-family="sans-serif" font-size="12">Ulsoor</text>
  <text x="1150" y="520" fill="#94a3b8" font-family="sans-serif" font-size="12">Indiranagar</text>
  <text x="1040" y="660" fill="#94a3b8" font-family="sans-serif" font-size="12">Koramangala</text>
  <text x="840" y="660" fill="#94a3b8" font-family="sans-serif" font-size="12">Jayanagar</text>
  <text x="820" y="720" fill="#94a3b8" font-family="sans-serif" font-size="12">JP Nagar</text>

  <!-- Clandestine Signal Filaments Across Bengaluru -->
  <path d="M 840 470 L 980 440 L 1060 450" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#cyanGlow3)"/>
  <path d="M 840 470 L 890 600 L 840 660 L 820 720" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Bottom Status Bar -->
  <rect x="32" y="1020" width="560" height="36" rx="3" fill="#070a10" opacity="0.95" stroke="rgba(255,255,255,0.1)"/>
  <text x="48" y="1043" fill="#10b981" font-family="monospace" font-size="11">STANDALONE VECTOR // ZERO EXTERNAL HTTP REQUESTS // NO WATERMARKS</text>
</svg>
