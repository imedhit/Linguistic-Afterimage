<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <filter id="cyanGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad2)"/>

  <!-- Top Navigation Bar -->
  <rect width="1920" height="64" fill="#06080d" opacity="0.95"/>
  <line x1="0" y1="64" x2="1920" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="32" y="40" fill="#ffffff" font-family="Georgia, serif" font-size="20">Ec(ak)ou Ghost Speech Cartography // Whole Bangalore</text>
  
  <!-- Sector Jump Nav Rail -->
  <rect x="740" y="16" width="440" height="34" rx="4" fill="#070a10" stroke="rgba(255,255,255,0.15)"/>
  <text x="755" y="38" fill="#94a3b8" font-family="monospace" font-size="11">SECTOR:</text>
  <rect x="815" y="20" width="46" height="26" fill="rgba(255,255,255,0.1)" rx="2"/>
  <text x="826" y="37" fill="#ffffff" font-family="monospace" font-size="11">ALL</text>
  <text x="880" y="37" fill="#94a3b8" font-family="monospace" font-size="11">CENTRAL</text>
  <text x="960" y="37" fill="#94a3b8" font-family="monospace" font-size="11">NORTH</text>
  <text x="1025" y="37" fill="#94a3b8" font-family="monospace" font-size="11">SOUTH</text>
  <text x="1090" y="37" fill="#94a3b8" font-family="monospace" font-size="11">EAST</text>

  <!-- Metropolitan Highway Arteries (Bellary Road, Hosur Road, Tumkur Road, Old Madras Road) -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none">
    <!-- Bellary Road (North to Central) -->
    <path d="M 880 80 L 920 480" stroke-width="3"/>
    <!-- Hosur Road (Central to South-East Electronic City) -->
    <path d="M 940 540 L 1280 980" stroke-width="3"/>
    <!-- Tumkur Road (North-West) -->
    <path d="M 380 180 L 860 480" stroke-width="2.5"/>
    <!-- Old Madras Road (East) -->
    <path d="M 960 480 L 1680 520" stroke-width="2.5"/>
    <!-- Outer Ring Road Loop -->
    <ellipse cx="940" cy="520" rx="520" ry="380" stroke="#334155" stroke-dasharray="10,6" stroke-width="2"/>
  </g>

  <!-- Regional Markers Spread Across Whole Bangalore -->
  <!-- YELAHANKA (North) -->
  <circle cx="910" cy="180" r="14" fill="rgba(0, 245, 212, 0.2)" stroke="#00f5d4"/>
  <text x="935" y="185" fill="#f8fafc" font-family="monospace" font-size="12">YELAHANKA // NORTH AIR BUFFER</text>
  <text x="935" y="200" fill="#94a3b8" font-family="monospace" font-size="10">13.1007°N, 77.5963°E</text>

  <!-- HEBBAL -->
  <circle cx="920" cy="300" r="12" fill="rgba(0, 245, 212, 0.2)" stroke="#00f5d4"/>
  <text x="945" y="305" fill="#f8fafc" font-family="monospace" font-size="11">HEBBAL LAKE SANCTUARY</text>

  <!-- CENTRAL PETE & CANTONMENT -->
  <circle cx="920" cy="490" r="22" fill="rgba(0, 245, 212, 0.3)" stroke="#00f5d4" stroke-width="2"/>
  <text x="955" y="495" fill="#00f5d4" font-family="monospace" font-weight="bold" font-size="13">CENTRAL: CHICKPET & RUSSELL MARKET</text>

  <!-- INDIRANAGAR & WHITEFIELD (East) -->
  <circle cx="1220" cy="490" r="12" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b"/>
  <text x="1245" y="495" fill="#f8fafc" font-family="monospace" font-size="11">INDIRANAGAR SUB-NODE</text>
  
  <circle cx="1520" cy="510" r="16" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-dasharray="4,4"/>
  <text x="1545" y="515" fill="#f43f5e" font-family="monospace" font-size="11">WHITEFIELD ITPL SEZ // MONITORED</text>

  <!-- ELECTRONIC CITY (Far South) -->
  <circle cx="1280" cy="940" r="24" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-dasharray="6,4"/>
  <text x="1315" y="945" fill="#f43f5e" font-family="monospace" font-weight="bold" font-size="12">ELECTRONIC CITY DATA DOME // DEAD ZONE</text>
  <text x="1315" y="962" fill="#94a3b8" font-family="monospace" font-size="10">12.8452°N, 77.6602°E</text>

  <!-- TURAHALLI FOREST (South-West) -->
  <circle cx="680" cy="860" r="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <text x="705" y="865" fill="#10b981" font-family="monospace" font-size="11">TURAHALLI GRANITE FOREST SANCTUARY</text>

  <!-- Connecting Signal Filament across Metropolis -->
  <path d="M 910 180 Q 920 340 920 490 T 1040 680 T 1280 940" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="8,6" filter="url(#cyanGlow2)"/>
  
  <!-- Bottom Coordinates Telemetry HUD -->
  <rect x="32" y="1020" width="720" height="36" rx="3" fill="#070a10" opacity="0.95" stroke="rgba(255,255,255,0.1)"/>
  <text x="48" y="1043" fill="#00f5d4" font-family="monospace" font-size="11">LEAFLET ENGINE // BOUNDS: [12.75°N, 77.38°E] TO [13.22°N, 77.85°E] · METRO COVERAGE</text>
</svg>
